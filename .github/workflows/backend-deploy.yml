name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/Services/**'
      - 'fix-apim-operations.ps1'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Services/**'
      - 'fix-apim-operations.ps1'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── Detect which services changed and build the matrices for them ──────────
  # NOTE: a job's `if:` cannot reference the `matrix` context (GitHub Actions
  # only exposes `matrix` inside that job's own steps), so instead of matrixing
  # over all 9 services and trying to skip legs with `if: contains(...)`, we
  # build a matrix here that only CONTAINS the services that changed.
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      any: ${{ steps.filter.outputs.changes != '[]' }}
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      deploy_matrix: ${{ steps.matrix.outputs.deploy_matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            RiskManagement: 'src/Services/RiskManagement/**'
            ComplianceTracking: 'src/Services/ComplianceTracking/**'
            PolicyManagement: 'src/Services/PolicyManagement/**'
            AuditManagement: 'src/Services/AuditManagement/**'
            StatementOfApplicability: 'src/Services/StatementOfApplicability/**'
            NonconformityAndCorrectiveActions: 'src/Services/NonconformityAndCorrectiveActions/**'
            AssetInventory: 'src/Services/AssetInventory/**'
            IncidentManagement: 'src/Services/IncidentManagement/**'
            CustomerPortal: 'src/Services/CustomerPortal/**'

      - name: Build matrices for changed services
        id: matrix
        run: |
          set -e
          changed='${{ steps.filter.outputs.changes }}'
          echo "Changed services: $changed"

          declare -A projects=(
            [RiskManagement]="src/Services/RiskManagement/GrcPlatform.RiskManagement.API/GrcPlatform.RiskManagement.API.csproj"
            [ComplianceTracking]="src/Services/ComplianceTracking/GrcPlatform.ComplianceTracking.API/GrcPlatform.ComplianceTracking.API.csproj"
            [PolicyManagement]="src/Services/PolicyManagement/GrcPlatform.PolicyManagement.API/GrcPlatform.PolicyManagement.API.csproj"
            [AuditManagement]="src/Services/AuditManagement/GrcPlatform.AuditManagement.API/GrcPlatform.AuditManagement.API.csproj"
            [StatementOfApplicability]="src/Services/StatementOfApplicability/GrcPlatform.StatementOfApplicability.API/GrcPlatform.StatementOfApplicability.API.csproj"
            [NonconformityAndCorrectiveActions]="src/Services/NonconformityAndCorrectiveActions/GrcPlatform.NonconformityAndCorrectiveActions.API/GrcPlatform.NonconformityAndCorrectiveActions.API.csproj"
            [AssetInventory]="src/Services/AssetInventory/GrcPlatform.AssetInventory.API/GrcPlatform.AssetInventory.API.csproj"
            [IncidentManagement]="src/Services/IncidentManagement/GrcPlatform.IncidentManagement.API/GrcPlatform.IncidentManagement.API.csproj"
            [CustomerPortal]="src/Services/CustomerPortal/GrcPlatform.CustomerPortal.API/GrcPlatform.CustomerPortal.API.csproj"
          )
          declare -A appnames=(
            [RiskManagement]="app-risk-grc-exelcom-dev"
            [ComplianceTracking]="app-compliance-grc-exelcom-dev"
            [PolicyManagement]="app-policy-grc-exelcom-dev"
            [AuditManagement]="app-audit-grc-exelcom-dev"
            [StatementOfApplicability]="app-soa-grc-exelcom-dev"
            [NonconformityAndCorrectiveActions]="app-nonconformity-grc-exelcom-dev"
            [AssetInventory]="app-asset-grc-exelcom-dev"
            [IncidentManagement]="app-incident-grc-exelcom-dev"
            [CustomerPortal]="app-portal-grc-exelcom-dev"
          )

          build_json="[]"
          deploy_json="[]"
          for name in $(echo "$changed" | jq -r '.[]'); do
            build_json=$(echo "$build_json" | jq -c --arg n "$name" --arg p "${projects[$name]}" '. + [{"name": $n, "project": $p}]')
            deploy_json=$(echo "$deploy_json" | jq -c --arg n "$name" --arg a "${appnames[$name]}" '. + [{"name": $n, "appName": $a}]')
          done

          echo "build_matrix=$build_json" >> "$GITHUB_OUTPUT"
          echo "deploy_matrix=$deploy_json" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $build_json"
          echo "Deploy matrix: $deploy_json"

  # ── Build & Test (only changed services) ────────────────────────────────────
  build-backend:
    name: Build Backend (${{ matrix.service.name }})
    needs: detect-changes
    if: needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.build_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ matrix.service.project }} --runtime linux-x64

      - name: Build
        run: dotnet build ${{ matrix.service.project }} --no-restore --configuration Release

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          dotnet publish ${{ matrix.service.project }} \
            --configuration Release \
            --output publish/${{ matrix.service.name }} \
            --runtime linux-x64 \
            --self-contained false

      # NOTE: zip runs FROM INSIDE the publish output folder so the DLLs land
      # at the zip root. The previous version zipped "publish/${name}" from the
      # repo root, which nested everything under publish/${name}/... inside the
      # zip — Kudu then extracted to /home/site/wwwroot/publish/${name}/*.dll
      # instead of /home/site/wwwroot/*.dll, so the App Service had no entry
      # point to run. This was the primary cause of the old pipeline's failures.
      - name: Zip artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: publish/${{ matrix.service.name }}
        run: zip -r ../${{ matrix.service.name }}.zip .

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}
          path: publish/${{ matrix.service.name }}.zip
          retention-days: 1

  # ── Deploy (main branch only, only changed services) ────────────────────────
  deploy-backend:
    name: Deploy ${{ matrix.service.name }}
    needs: [detect-changes, build-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.detect-changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # All 9 services share a single B1 App Service Plan — throttling
      # concurrent Kudu deploys was one of the suspected causes of the old
      # pipeline's flakiness.
      max-parallel: 3
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.deploy_matrix) }}

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service.name }}
          path: publish/

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.service.appName }}
          package: publish/${{ matrix.service.name }}.zip
        timeout-minutes: 10

      - name: Wait before retry
        if: failure()
        run: sleep 30

      - name: Retry Deploy if failed
        if: failure()
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.service.appName }}
          package: publish/${{ matrix.service.name }}.zip
        timeout-minutes: 10

  # ── Post-deploy: restore APIM operation bindings ────────────────────────────
  # APIM loses HTTP method bindings on the affected APIs after every backend
  # deploy (known project issue). This used to be a manual step; now it always
  # runs once after any successful backend deploy.
  fix-apim:
    name: Fix APIM operation bindings
    needs: [detect-changes, deploy-backend]
    if: always() && needs.deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fix APIM operations
        shell: pwsh
        run: ./fix-apim-operations.ps1
