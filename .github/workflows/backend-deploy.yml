name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - 'src/Services/**'
      - 'fix-apim-operations.ps1'
      - '.github/workflows/backend-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/Services/**'
      - 'fix-apim-operations.ps1'
      - '.github/workflows/backend-deploy.yml'

permissions:
  id-token: write
  contents: read

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  # ── Detect which services actually changed ─────────────────────────────────
  detect-changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      any: ${{ steps.filter.outputs.changes != '[]' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            RiskManagement: 'src/Services/RiskManagement/**'
            ComplianceTracking: 'src/Services/ComplianceTracking/**'
            PolicyManagement: 'src/Services/PolicyManagement/**'
            AuditManagement: 'src/Services/AuditManagement/**'
            StatementOfApplicability: 'src/Services/StatementOfApplicability/**'
            NonconformityAndCorrectiveActions: 'src/Services/NonconformityAndCorrectiveActions/**'
            AssetInventory: 'src/Services/AssetInventory/**'
            IncidentManagement: 'src/Services/IncidentManagement/**'
            CustomerPortal: 'src/Services/CustomerPortal/**'

  # ── Build & Test (only changed services) ────────────────────────────────────
  build-backend:
    name: Build Backend (${{ matrix.service.name }})
    needs: detect-changes
    if: contains(fromJson(needs.detect-changes.outputs.services), matrix.service.name)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: RiskManagement
            project: src/Services/RiskManagement/GrcPlatform.RiskManagement.API/GrcPlatform.RiskManagement.API.csproj
          - name: ComplianceTracking
            project: src/Services/ComplianceTracking/GrcPlatform.ComplianceTracking.API/GrcPlatform.ComplianceTracking.API.csproj
          - name: PolicyManagement
            project: src/Services/PolicyManagement/GrcPlatform.PolicyManagement.API/GrcPlatform.PolicyManagement.API.csproj
          - name: AuditManagement
            project: src/Services/AuditManagement/GrcPlatform.AuditManagement.API/GrcPlatform.AuditManagement.API.csproj
          - name: StatementOfApplicability
            project: src/Services/StatementOfApplicability/GrcPlatform.StatementOfApplicability.API/GrcPlatform.StatementOfApplicability.API.csproj
          - name: NonconformityAndCorrectiveActions
            project: src/Services/NonconformityAndCorrectiveActions/GrcPlatform.NonconformityAndCorrectiveActions.API/GrcPlatform.NonconformityAndCorrectiveActions.API.csproj
          - name: AssetInventory
            project: src/Services/AssetInventory/GrcPlatform.AssetInventory.API/GrcPlatform.AssetInventory.API.csproj
          - name: IncidentManagement
            project: src/Services/IncidentManagement/GrcPlatform.IncidentManagement.API/GrcPlatform.IncidentManagement.API.csproj
          - name: CustomerPortal
            project: src/Services/CustomerPortal/GrcPlatform.CustomerPortal.API/GrcPlatform.CustomerPortal.API.csproj

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ matrix.service.project }} --runtime linux-x64

      - name: Build
        run: dotnet build ${{ matrix.service.project }} --no-restore --configuration Release

      - name: Publish
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          dotnet publish ${{ matrix.service.project }} \
            --configuration Release \
            --output publish/${{ matrix.service.name }} \
            --runtime linux-x64 \
            --self-contained false

      # NOTE: zip runs FROM INSIDE the publish output folder so the DLLs land
      # at the zip root. The previous version zipped "publish/${name}" from the
      # repo root, which nested everything under publish/${name}/... inside the
      # zip — Kudu then extracted to /home/site/wwwroot/publish/${name}/*.dll
      # instead of /home/site/wwwroot/*.dll, so the App Service had no entry
      # point to run. This was the primary cause of the old pipeline's failures.
      - name: Zip artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: publish/${{ matrix.service.name }}
        run: zip -r ../${{ matrix.service.name }}.zip .

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service.name }}
          path: publish/${{ matrix.service.name }}.zip
          retention-days: 1

  # ── Deploy (main branch only, only changed services) ────────────────────────
  deploy-backend:
    name: Deploy ${{ matrix.service.name }}
    needs: [detect-changes, build-backend]
    if: >-
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      contains(fromJson(needs.detect-changes.outputs.services), matrix.service.name)
    runs-on: ubuntu-latest
    environment: production
    strategy:
      fail-fast: false
      # Deploys run concurrently by default, but all 9 services share a single
      # B1 App Service Plan — throttling Kudu deploys here to reduce
      # concurrent load was one of the suspected causes of prior flakiness.
      max-parallel: 3
      matrix:
        service:
          - name: RiskManagement
            appName: app-risk-grc-exelcom-dev
          - name: ComplianceTracking
            appName: app-compliance-grc-exelcom-dev
          - name: PolicyManagement
            appName: app-policy-grc-exelcom-dev
          - name: AuditManagement
            appName: app-audit-grc-exelcom-dev
          - name: StatementOfApplicability
            appName: app-soa-grc-exelcom-dev
          - name: NonconformityAndCorrectiveActions
            appName: app-nonconformity-grc-exelcom-dev
          - name: AssetInventory
            appName: app-asset-grc-exelcom-dev
          - name: IncidentManagement
            appName: app-incident-grc-exelcom-dev
          - name: CustomerPortal
            appName: app-portal-grc-exelcom-dev

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.service.name }}
          path: publish/

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.service.appName }}
          package: publish/${{ matrix.service.name }}.zip
        timeout-minutes: 10

      - name: Wait before retry
        if: failure()
        run: sleep 30

      - name: Retry Deploy if failed
        if: failure()
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ matrix.service.appName }}
          package: publish/${{ matrix.service.name }}.zip
        timeout-minutes: 10

  # ── Post-deploy: restore APIM operation bindings ────────────────────────────
  # APIM loses HTTP method bindings on the affected APIs after every backend
  # deploy (known project issue). This used to be a manual step; now it always
  # runs once after any successful backend deploy.
  fix-apim:
    name: Fix APIM operation bindings
    needs: [detect-changes, deploy-backend]
    if: always() && needs.deploy-backend.result == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fix APIM operations
        shell: pwsh
        run: ./fix-apim-operations.ps1
